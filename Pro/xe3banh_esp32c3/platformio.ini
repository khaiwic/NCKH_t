; ============================================================================
;  PROJECT: Xe 3 banh ESP32-C3 - Dieu khien vi tri bang PID
; ============================================================================
;
; GHI CHU QUAN TRONG VE PHIEN BAN FRAMEWORK (kiem tra thang 7/2026):
;   Goi "platformio/espressif32" CHINH THUC hien tai van dong bang Arduino
;   core 2.0.17 (dua tren ESP-IDF 4.4.7) - ho khong dong bo len Arduino core
;   3.x. Vi vay code trong project nay (xem lib/Motor/Motor.cpp) duoc viet de
;   tu dong thich ung ca 2 truong hop (core 2.x dung ledcSetup/ledcAttachPin,
;   core 3.x dung ledcAttach) thong qua kiem tra macro ESP_ARDUINO_VERSION_MAJOR.
;   => Ban khong can chinh sua gi neu dung cau hinh mac dinh ben duoi.
;
[env:esp32-c3]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed  = 460800

; Mot so board ESP32-C3 dang "clone gia re" (vi du: ESP32-C3 SuperMini) dung
; cong USB-C noi truc tiep vao chip (native USB) thay vi qua IC cau UART rieng
; (CP2102/CH340...). 2 dong build_flags ben duoi giup cong Serial Monitor hoat
; dong on dinh qua USB truc tiep nay.
; => Neu board cua ban dung IC UART-USB rieng (co chip CP2102/CH340 tren mach)
;    va gap loi khong thay gi tren Serial Monitor, hay XOA 2 dong build_flags nay.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
